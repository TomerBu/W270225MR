{% extends 'quotes/base.html' %}

{% block title %}
  Quotes
{% endblock %}


{% block content %}
  <h1>Quotes List</h1>
  <table class="table table-striped table-bordered">
    <tr>
      <th>Quote</th>
      <th>Author</th>
      <th>Year</th>
      <th>Actions</th>
    </tr>

    {% for quote in quotes %}
      <tr>
        <td>{{ quote.quote }}</td>
        <td>{{ quote.author }}</td>
        <td>{{ quote.year }}</td>
        <td>
          <a href="{% url "delete_quote" quote.id %}">Delete</a> |
          <a href="{% url "edit_quote" quote.id %}">Edit</a>
        </td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
