components:
  schemas:
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          minLength: 5
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        post:
          type: integer
        author:
          type: integer
        reply_to:
          type: integer
          nullable: true
      required:
      - author
      - created_at
      - id
      - post
      - text
      - updated_at
    LikeTypeEnum:
      enum:
      - like
      - dislike
      type: string
      description: |-
        * `like` - Like
        * `dislike` - Dislike
    PatchedComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          minLength: 5
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        post:
          type: integer
        author:
          type: integer
        reply_to:
          type: integer
          nullable: true
    PatchedPost:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          pattern: ^[\w\s]+$
          maxLength: 100
          minLength: 5
        text:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        author:
          type: integer
        tags:
          type: array
          items:
            type: integer
    PatchedPostUserLikes:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        like_type:
          $ref: '#/components/schemas/LikeTypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
        post:
          type: integer
    PatchedTag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 32
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
    PatchedUserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bio:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
    Post:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          pattern: ^[\w\s]+$
          maxLength: 100
          minLength: 5
        text:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        author:
          type: integer
        tags:
          type: array
          items:
            type: integer
      required:
      - author
      - created_at
      - id
      - text
      - title
      - updated_at
    PostUserLikes:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        like_type:
          $ref: '#/components/schemas/LikeTypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
        post:
          type: integer
      required:
      - created_at
      - id
      - post
      - updated_at
      - user
    StatusEnum:
      enum:
